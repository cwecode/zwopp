<!doctype html>
<!--
  Source of banner-light.png and banner-dark.png (1600 × 500, top of the README).
  banner.html?theme=dark gives the dark one. Render both with:
  node docs/media/brand/render-social-preview.mjs
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 500px; overflow: hidden; }
  body {
    --text: #263143; --muted: #5B6678; --edge: rgba(17, 24, 39, .18);
    --shadow: 0 30px 70px rgba(38, 49, 67, .28), 0 8px 20px rgba(38, 49, 67, .14);
    font-family: Inter, sans-serif;
    background: linear-gradient(135deg, #FFFBF8 0%, #FFF6EF 45%, #F5F8FD 100%);
    position: relative;
    color: var(--text);
  }
  body.dark {
    --text: #F8FAFC; --muted: #A5B0C2; --edge: rgba(255, 255, 255, .14);
    --shadow: 0 30px 70px rgba(0, 0, 0, .55), 0 8px 20px rgba(0, 0, 0, .35);
    background: linear-gradient(135deg, #131B2B 0%, #1A2336 50%, #253148 100%);
  }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 560px; height: 560px; left: 150px; top: -380px; background: #FFE6D6; opacity: .7; }
  .b2 { width: 760px; height: 760px; right: -260px; bottom: -560px; background: #FFEFD2; opacity: .8; }
  .dark .b1 { background: #FF6A3D; opacity: .07; }
  .dark .b2 { background: #FFC145; opacity: .06; }

  .left { position: absolute; left: 80px; top: 70px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 120px; height: 120px; }
  .brand span { font-weight: 800; font-size: 104px; letter-spacing: -.05em; line-height: 1; }
  h1 { font-weight: 800; font-size: 46px; line-height: 1.15; letter-spacing: -.03em; margin-top: 44px; }
  .platforms { position: absolute; left: 82px; bottom: 64px; font-weight: 600; font-size: 24px; color: var(--muted); }

  .window {
    position: absolute; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--edge); box-shadow: var(--shadow); background: #1b1b1b;
  }
  .window img { display: block; width: 100%; }
  .library { width: 640px; right: -60px; top: 34px; }
  .editor  { width: 660px; right: 160px; top: 128px; }
</style>
</head>
<body>
  <script>if (new URLSearchParams(location.search).get("theme") === "dark") document.body.classList.add("dark");</script>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="window library"><img src="../library.jpg" alt=""></div>
  <div class="window editor"><img src="../annotated.png" alt=""></div>

  <div class="left">
    <div class="brand"><img src="icon.svg" alt=""><span>Zwopp</span></div>
    <h1>Explain every<br>screenshot clearly.</h1>
  </div>
  <div class="platforms">Windows · macOS · Linux · Open Source</div>
</body>
</html>
