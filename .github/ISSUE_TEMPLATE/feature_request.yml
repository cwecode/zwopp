name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Zwopp help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: A workaround, another tool, or not at all.
