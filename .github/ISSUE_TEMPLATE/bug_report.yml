name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press the capture hotkey
        2. Select a window on the second monitor
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zwopp version
      description: Settings › Updates shows it, e.g. 1.3.0; or the commit when built from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (Wayland)
        - Linux (X11)
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version and setup
      description: For example "macOS 15.4", "Ubuntu 24.04, GNOME", or "two monitors, 150 % scaling".
  - type: textarea
    id: solution
    attributes:
      label: Idea for a fix (optional)
      description: If you have an idea what causes it or how Zwopp could do better, tell us.
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: >-
        Filled in by Zwopp's "Report a problem" if you chose to attach it (home folder and
        user name are left out). Otherwise: Settings › Report a problem › Open the log folder.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots
      description: Please remove anything private from screenshots before you attach them (Zwopp's pixelate tool, B, helps).
