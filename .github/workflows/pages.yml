name: Pages

# Publishes the landing page (site/) with the pictures from docs/media to
# GitHub Pages, https://cwecode.github.io/zwopp/.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/media/brand
          cp -r site/. _site/
          cp docs/media/*.png docs/media/*.jpg docs/media/*.gif _site/media/
          cp docs/media/brand/icon.svg docs/media/brand/social-preview.png _site/media/brand/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
