name: Release

# A version tag (v1.0.0, or v1.0.0-rc.1 for a test run) builds unsigned
# installers for every OS and attaches them, with SHA-256 checksums, to a
# draft GitHub release. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create:
    name: create draft
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to find the previous release for the compare link.
          fetch-depth: 0

      - name: Tag matches the app version
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          for found in \
            "$(jq -r .version apps/desktop/package.json)" \
            "$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"; do
            if [ "$found" != "$base" ]; then
              echo "::error::tag $TAG does not match version $found"
              exit 1
            fi
          done

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          # The section between "## <version>" and the next "## " heading.
          awk -v v="$base" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $base'"
            exit 1
          fi
          # Pictures in the changelog (![…](docs/media/…)) point at the repository
          # as of this tag, so they show on the release page.
          raw="https://raw.githubusercontent.com/${{ github.repository }}/$TAG/"
          sed -i -E "s#(!\[[^]]*\]\()(\./)?([^):/][^):]*\))#\1${raw}\3#g" notes.md
          cat >> notes.md <<'EOF'

          ### Downloads

          | | |
          |---|---|
          | Windows 10/11 | `Zwopp-windows-x64-setup.exe` (or the `.msi`) |
          | macOS | `Zwopp-macos-apple-silicon.dmg` (M1 or newer) or `Zwopp-macos-intel.dmg` |
          | Linux | `Zwopp-linux-x86_64.AppImage`, `Zwopp-linux-amd64.deb` or `Zwopp-linux-x86_64.rpm` (Ubuntu 24.04, Debian 13 or newer) |

          The same files with the version in their name (`Zwopp_<version>_…`) are there for the updater.

          The downloads are not signed, so the first start asks once:

          - **Windows:** "Windows protected your PC" → *More info* → *Run anyway*.
          - **macOS:** right-click the app → *Open*, or *System Settings → Privacy & Security →
            Open Anyway*. Then allow *Screen Recording* for Zwopp.

          Check a download against `SHA256SUMS.txt`, e.g. `sha256sum -c SHA256SUMS.txt --ignore-missing`.
          EOF

      - name: Pull requests and compare link
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          # The newest stable tag before this version (test runs skipped).
          prev=$({ git tag -l 'v*' | grep -v -- -; echo "v$base"; } | sort -V -u \
            | grep -B1 -x "v$base" | head -n1)
          args=(-f tag_name="$TAG")
          if [ -n "$prev" ] && [ "$prev" != "v$base" ]; then
            args+=(-f previous_tag_name="$prev")
          fi
          # Merged pull requests by category (.github/release.yml), new
          # contributors and "Full Changelog: vX...vY".
          generated=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            "${args[@]}" --jq .body)
          printf '\n---\n\n%s\n' "$generated" >> notes.md
          cat notes.md

      - name: Create the draft
        id: release
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          # Drafts are not found by tag (and a fresh one not even in the
          # release list yet), so the builds attach to the id it returns.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Zwopp $TAG" -F body=@notes.md \
            -F draft=true -F prerelease="$prerelease" --jq .id)
          if [ -z "$id" ]; then
            echo "::error::could not create the draft release"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux
            # 22.04 ships PipeWire 0.3.48, too old for libspa 0.10 (via xcap).
            os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; the public key is in tauri.conf.json (ADR 0010).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create.outputs.release-id }}
          args: ${{ matrix.args }}
          # latest.json, which installed apps ask for new versions.
          uploadUpdaterJson: true

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # tauri-action leaves the notes empty when it uploads to an existing
      # release; the update offer in the app shows them ("What's new?").
      - name: Release notes into latest.json
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          # The app shows the notes as plain text, so pictures are left out.
          awk -v v="$base" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | grep -v '^[[:space:]]*!\[' | cat -s > notes.md
          gh release download "$TAG" --repo "${{ github.repository }}" -p latest.json -D updater
          jq --rawfile notes notes.md '.notes = ($notes | sub("^\\s+"; "") | sub("\\s+$"; ""))' \
            updater/latest.json > latest.json
          gh release upload "$TAG" latest.json --repo "${{ github.repository }}" --clobber

      - name: SHA256SUMS.txt for all downloads
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "${{ github.repository }}"
          # Copies without the version in the name, for the README's download links
          # (…/releases/latest/download/<name> always points at the newest release).
          version="${TAG#v}"
          version="${version%%-*}"
          cp "Zwopp_${version}_x64-setup.exe" Zwopp-windows-x64-setup.exe
          cp "Zwopp_${version}_aarch64.dmg" Zwopp-macos-apple-silicon.dmg
          cp "Zwopp_${version}_x64.dmg" Zwopp-macos-intel.dmg
          cp "Zwopp_${version}_amd64.AppImage" Zwopp-linux-x86_64.AppImage
          cp "Zwopp_${version}_amd64.deb" Zwopp-linux-amd64.deb
          cp "Zwopp-${version}-1.x86_64.rpm" Zwopp-linux-x86_64.rpm
          gh release upload "$TAG" Zwopp-windows-x64-setup.exe Zwopp-macos-apple-silicon.dmg \
            Zwopp-macos-intel.dmg Zwopp-linux-x86_64.AppImage Zwopp-linux-amd64.deb \
            Zwopp-linux-x86_64.rpm --repo "${{ github.repository }}" --clobber
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
