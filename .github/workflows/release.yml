name: Release

# A version tag (v1.0.0, or v1.0.0-rc.1 for a test run) builds unsigned
# installers for every OS and attaches them, with SHA-256 checksums, to a
# draft GitHub release. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create:
    name: create draft
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          for found in \
            "$(jq -r .version apps/desktop/package.json)" \
            "$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"; do
            if [ "$found" != "$base" ]; then
              echo "::error::tag $TAG does not match version $found"
              exit 1
            fi
          done

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          # The section between "## <version>" and the next "## " heading.
          awk -v v="$base" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $base'"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Downloads

          | | |
          |---|---|
          | Windows | `Zwopp_*_x64-setup.exe` (or the `.msi`) |
          | macOS | `Zwopp_*_aarch64.dmg` (Apple silicon) or `Zwopp_*_x64.dmg` (Intel) |
          | Linux | `.AppImage`, `.deb` or `.rpm` (Ubuntu 24.04, Debian 13 or newer) |

          The downloads are not signed, so the first start asks once:

          - **Windows:** "Windows protected your PC" → *More info* → *Run anyway*.
          - **macOS:** right-click the app → *Open*, or *System Settings → Privacy & Security →
            Open Anyway*. Then allow *Screen Recording* for Zwopp.

          Check a download against `SHA256SUMS.txt`, e.g. `sha256sum -c SHA256SUMS.txt --ignore-missing`.
          EOF

      - name: Create the draft
        id: release
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          # Drafts are not found by tag (and a fresh one not even in the
          # release list yet), so the builds attach to the id it returns.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Zwopp $TAG" -F body=@notes.md \
            -F draft=true -F prerelease="$prerelease" --jq .id)
          if [ -z "$id" ]; then
            echo "::error::could not create the draft release"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux
            # 22.04 ships PipeWire 0.3.48, too old for libspa 0.10 (via xcap).
            os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create.outputs.release-id }}
          args: ${{ matrix.args }}

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: SHA256SUMS.txt for all downloads
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "${{ github.repository }}"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
