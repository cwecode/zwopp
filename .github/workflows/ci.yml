name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that does not depend on the OS, once.
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w apps/desktop
      # Known vulnerabilities in what ships with the app (not dev tools).
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests use the cache of main but do not fill it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The Tauri build embeds the frontend, so it must exist before cargo runs.
      - run: npm run build:web

      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Windows installer, as the release builds it, so a broken icon or
  # bundle setting shows up now and not when tagging a release.
  bundle:
    name: bundle (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Without signed update files: the signing key is only available to releases.
      - run: npm run tauri -w apps/desktop -- build --ci --bundles nsis --config src-tauri/ci.conf.json

  # Known vulnerabilities, licenses and sources of the Rust dependencies (deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
