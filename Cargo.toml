[workspace]
resolver = "3"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cwecode/screenbook"
rust-version = "1.90"

# Dependencies are optimized in dev builds too: image encoding and screen
# capture are 10-70x slower unoptimized (a capture took seconds in `npm run dev`).
# The core as well: the encoders are generic and get compiled where they are
# used. The desktop app crate stays at opt-level 0, so it rebuilds fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.screenbook-core]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
